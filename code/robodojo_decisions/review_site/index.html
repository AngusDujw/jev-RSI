<style>
:root{--bg:#f0efe9;--paper:#fafaf5;--ink:#202b29;--muted:#66736d;--line:#d4d9ce;--mint:#b5d8ba;--deep:#24483b;--red:#8d4738;--orange:#aa7931;--mono:'DejaVu Sans Mono','Liberation Mono',monospace;--body:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;--serif:'Noto Serif CJK SC','Songti SC',serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--body)}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;padding:7px 12px}button:hover{background:#e3eadf}a{color:var(--deep);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font:600 31px/1.4 var(--serif);letter-spacing:-.5px}h2{font:600 21px var(--serif)}h3{font-size:15px}pre,code,.mono{font-family:var(--mono);font-size:12px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}header{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #446351;background:var(--deep);color:#edf2e9}.brand{display:flex;align-items:center;gap:13px}.brandmark{width:35px;height:35px;border:1px solid var(--mint);display:grid;place-items:center;font:600 25px var(--serif);color:var(--mint)}.brand strong{font-size:18px;letter-spacing:.4px}.small{font-size:12px;color:var(--muted)}header .small{color:#b6c6b6}.head-actions{display:flex;align-items:center;gap:15px}header button{background:transparent;color:#e8eee6;border-color:#718a75}.layout{display:grid;grid-template-columns:260px minmax(0,1fr)}aside{position:sticky;top:0;height:calc(100vh - 77px);overflow:auto;border-right:1px solid var(--line);background:#e7eae1;padding:22px 14px}.aside-title{font:11px var(--mono);letter-spacing:2px;color:var(--muted);padding:0 9px;margin-bottom:12px}#search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);margin-bottom:14px}.task-button{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:none;border-radius:4px;padding:10px}.task-button strong{display:block;font-size:13px}.task-button small{display:block;font:10px var(--mono);color:var(--muted);word-break:break-word}.task-button.active{background:var(--deep);color:#f2f6ed}.task-button.active small{color:#bbcdbb}.task-count{font:11px var(--mono);white-space:nowrap}.aside-note{border-top:1px solid var(--line);padding:18px 9px;font-size:12px;color:var(--muted);margin-top:14px}main{padding:28px 32px 80px;max-width:1600px;width:100%;min-width:0}.overview{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:1px;border:1px solid var(--line);background:var(--line);margin-bottom:23px}.stat{background:var(--paper);padding:17px 22px}.stat .value{font:32px/1.2 var(--serif);margin:3px 0}.stat .value em{font:16px var(--mono);font-style:normal;color:var(--muted)}.stat:first-child{background:#e5eddf}.stat-label{font-size:12px;color:var(--muted)}.notice{border-left:3px solid var(--orange);background:#eeeadb;color:#625536;padding:10px 15px;margin-bottom:24px;font-size:12px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:22px 0 15px}.eyebrow{font:11px var(--mono);color:var(--muted);letter-spacing:2px;margin-bottom:6px}.instruction{max-width:900px;margin-top:7px;font-size:14px}.run-picker{padding:13px 16px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:16px}.run-picker label{font-size:12px;color:var(--muted)}select{min-width:180px;max-width:100%;border:1px solid var(--line);padding:8px;background:#f0f3e9;color:var(--ink);flex:1}.run-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.pill{font:11px var(--mono);border:1px solid var(--line);background:var(--paper);padding:3px 9px;border-radius:3px}.pill.failure{color:var(--red);background:#f4e8df;border-color:#dec3b4}.pill.good{color:var(--deep);background:#e3eee1}.section{background:var(--paper);border:1px solid var(--line);margin-bottom:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line)}.section-content{padding:18px 20px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button.active{background:var(--deep);color:#eef4e9;border-color:var(--deep)}details{border:1px solid var(--line);background:#f2f4ec;margin-top:11px;border-radius:3px}summary{cursor:pointer;padding:10px 13px;font-size:13px;overflow-wrap:anywhere}details pre{padding:14px;border-top:1px solid var(--line);max-height:580px;overflow:auto;background:#f7f8f1}.plan-stages{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}.stage-chip{font:11px var(--mono);color:var(--deep);padding:6px 9px;border:1px solid #c5d1c0;background:#e8efdf}.stage-chip.active{background:var(--deep);color:white}.plan-recipe{padding:13px;background:#e8efdf;border-left:2px solid var(--deep);font-size:13px}.stage-explanation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:12px 0}.stage-box{border-left:2px solid var(--line);padding:7px 12px;min-width:0}.stage-box strong{display:block;font:12px var(--mono);margin-top:4px;overflow-wrap:anywhere}.film{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:19px}.film video{width:100%;background:#17251e;max-height:340px;border-radius:3px}.film-note{font-size:12px;color:var(--muted)}.timeline-controls{display:flex;align-items:center;gap:10px;margin-bottom:10px}.timeline-controls input{flex:1;accent-color:var(--deep);min-width:60px}.timeline{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;max-height:130px}.tick{flex:0 0 auto;padding:7px 9px;min-width:48px;font:11px var(--mono)}.tick.active{background:var(--deep);color:white;border-color:var(--deep)}.tick.stop{border-top:3px solid var(--orange)}.tick.gripper{border-top:3px solid var(--red)}.stage-ribbon{margin-top:12px;display:flex;gap:5px;flex-wrap:wrap}.ribbon{font:10px var(--mono);padding:3px 7px;background:#e5eadd;border:1px solid var(--line)}.decision-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.decision-heading h3{font:21px var(--serif)}.camera-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.camera{margin:0;min-width:0}.camera button{display:block;width:100%;padding:0;border:0;background:#26372b;border-radius:3px;overflow:hidden}.camera img{width:100%;display:block;aspect-ratio:4/3;object-fit:contain}.camera figcaption{padding:7px 1px;font:11px var(--mono);color:var(--muted)}.hash{font:9px var(--mono);color:#869083;overflow-wrap:anywhere}.decision-columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:17px;margin-top:18px}.subhead{font:11px var(--mono);letter-spacing:1px;color:var(--muted);margin:0 0 9px}.answer{padding:14px;background:#e5eddf;border:1px solid #c7d4bf;font:12px/1.7 var(--mono);overflow-wrap:anywhere}.prob-group{margin-top:14px}.prob-row{display:grid;grid-template-columns:minmax(110px,1fr) 90px 38px;align-items:center;gap:8px;font:10px var(--mono);margin:5px 0}.prob-name{overflow-wrap:anywhere}.prob-track{background:#e3e6db;height:6px}.prob-fill{height:6px;background:#829b7d}.prob-row.selected .prob-fill{background:var(--deep)}.prob-row.selected .prob-name{font-weight:bold;color:var(--deep)}.execution{border-left:3px solid var(--deep);padding:11px 14px;background:#eaf0e3;margin-top:14px}.empty{padding:30px 10px;color:var(--muted);text-align:center}.fatal{padding:28px;background:#f4e6d9;color:var(--red)}.action-line{font:12px var(--mono);overflow-wrap:anywhere}.missing{background:#f6eedf;color:#745839;padding:12px;border:1px solid #e0cfad;font-size:12px}.method-note{background:#e7eee2;padding:12px 14px;font-size:12px;line-height:1.9}.provenance{font-size:11px;color:var(--muted);padding-top:15px;overflow-wrap:anywhere}.gridfields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{padding:8px 10px;border:1px solid var(--line);background:#f0f3e9;min-width:0}.field strong{display:block;font:11px var(--mono);overflow-wrap:anywhere}.field .small{font-size:10px}.modal{display:none;position:fixed;inset:0;background:#101d18e8;z-index:20;padding:35px;align-items:center;justify-content:center}.modal.open{display:flex}.modal img{max-width:95vw;max-height:88vh;object-fit:contain}.modal button{position:absolute;right:20px;top:15px}.loading{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.loading{animation:none}}@media(max-width:1150px){main{padding:24px 20px}.layout{grid-template-columns:210px 1fr}.decision-columns{grid-template-columns:1fr}.film{grid-template-columns:1fr}.overview{grid-template-columns:repeat(2,1fr)}.stage-explanation{grid-template-columns:1fr}.gridfields{grid-template-columns:1fr}}@media(max-width:720px){header{padding:0 16px;height:69px}.brand strong{font-size:14px}.head-actions .small{display:none}.layout{display:block}aside{height:auto;position:relative;padding:12px;border-right:0;border-bottom:1px solid var(--line)}#task-list{display:flex;overflow-x:auto;max-height:130px}#search{margin-bottom:6px}.task-button{flex:0 0 160px}.aside-title,.aside-note{display:none}main{padding:18px 12px}.camera-grid{grid-template-columns:1fr}.camera img{max-height:280px}.title-row{flex-direction:column}h1{font-size:26px}.stat{padding:14px}.section-content{padding:14px}.run-picker{padding:10px}.modal{padding:10px}.prob-row{grid-template-columns:minmax(80px,1fr) 75px 35px}}
</style>
</head>
<body>
<header><div class="brand"><div class="brandmark">R</div><div><strong>RoboDojo · 实验证据台</strong><div class="small">计划 / 阶段 / 感知 / 决策 / 原生执行</div></div></div><div class="head-actions"><a class="small" href="/prompts">提示词与决策复盘 ↗</a><span class="small" id="updated">正在读取记录</span><button id="refresh">刷新</button></div></header>
<div class="layout"><aside><div class="aside-title">TASK REGISTER / 任务档案</div><input id="search" aria-label="搜索任务" placeholder="搜索任务 / task name"><div id="task-list"></div><div class="aside-note">只读展示原始实验记录。<br>任务成功只认原生 <code>success=true</code>。<br><code>complete=true</code> 可只是回合终止。<br><br>“只有预检”表示没有推进器控制记录，不是任务跑通。</div></aside>
<main><div class="overview" id="overview"></div><div class="notice">这些是已结束或已落盘的完整回合记录，不代表完整任务成功。老日志未保存的题目原文会标为缺失；不会用当前提示词补写历史输入。</div><div id="content"><div class="empty loading">正在载入实验档案…</div></div></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="相机原图"><button id="close-modal">关闭 ✕</button><img id="modal-image" alt="相机原图"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>JSON.stringify(x,null,2),fmt=x=>x===undefined||x===null?'未记录':String(x),cameraNames={cam_high:'固定高位',cam_left_wrist:'左腕',cam_right_wrist:'右腕'};
let archive=null,task=null,run=null,turn=0,loadToken=0;
const disclosure=(title,value,open=false)=>`<details ${open?'open':''}><summary>${esc(title)}</summary><pre>${esc(typeof value==='string'?value:pretty(value))}</pre></details>`;
const link=(label,url)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`:'';
const stageValue=x=>typeof x==='string'?x:pretty(x);
function decodedStage(d){return d.runtime_stage||d.model_stage||'阶段未逐步落盘'}
function cards(data){$('overview').innerHTML=`<div class="stat"><div class="stat-label">原生完整任务成功</div><div class="value">${data.success_tasks}<em> / ${data.task_count}</em></div><div class="small">当前日志中的 success=true</div></div><div class="stat"><div class="stat-label">任务入口覆盖</div><div class="value">${data.task_count}</div><div class="small">包含零动作传感预检</div></div><div class="stat"><div class="stat-label">有推进器记录的任务</div><div class="value">${data.controlled_tasks}</div><div class="small">其余任务仅有预检</div></div><div class="stat"><div class="stat-label">回合 / 推进器调用</div><div class="value">${data.run_count}<em> / ${data.decision_count}</em></div><div class="small">来自原生日志目录</div></div>`;$('updated').textContent='快照 '+new Date(data.generated_at).toLocaleTimeString('zh-CN');}
function taskList(){const term=$('search').value.toLowerCase();$('task-list').innerHTML=archive.tasks.filter(t=>(t.id+' '+t.label).toLowerCase().includes(term)).map(t=>`<button class="task-button ${task?.id===t.id?'active':''}" data-task="${esc(t.id)}"><span><strong>${esc(t.label)}</strong><small>${esc(t.id)}</small></span><span class="task-count">${t.control_runs?t.control_runs+' 回合':'仅预检'}</span></button>`).join('');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>chooseTask(b.dataset.task));}
async function fetchJSON(url){const response=await fetch(url);if(!response.ok)throw Error(`${response.status} ${response.statusText}`);return response.json();}
async function init(refresh=false){try{archive=await fetchJSON('/api/index'+(refresh?'?refresh=1':''));cards(archive);const requested=new URLSearchParams(location.hash.slice(1));const selected=task?.id||requested.get('task')||'general_pickup';taskList();await chooseTask(archive.tasks.some(t=>t.id===selected)?selected:archive.tasks[0].id,requested.get('run'));}catch(e){$('content').innerHTML=`<div class="fatal">读取失败：${esc(e.message)}。请刷新重试。</div>`;}}
async function chooseTask(id,runName){task=archive.tasks.find(t=>t.id===id);if(!task)return;taskList();await chooseRun(runName&&task.runs.some(r=>r.name===runName)?runName:task.representative);}
async function chooseRun(name){const token=++loadToken;$('content').innerHTML='<div class="empty loading">正在读取完整回合、计划和原始输入…</div>';try{const value=await fetchJSON('/api/run?name='+encodeURIComponent(name));if(token!==loadToken)return;run=value;turn=0;history.replaceState(null,'','#task='+encodeURIComponent(task.id)+'&run='+encodeURIComponent(name));renderRun();}catch(e){if(token===loadToken)$('content').innerHTML=`<div class="fatal">回合读取失败：${esc(e.message)}</div>`;}}
function renderRun(){const meta=task.runs.find(r=>r.name===run.name),result=run.result||{},hasDecisions=run.decisions.length>0;const initial=run.plans[0]?.data;
$('content').innerHTML=`<div class="title-row"><div><div class="eyebrow">TASK / ${esc(task.id)}</div><h1>${esc(task.label)}</h1><p class="instruction">${esc(task.instruction||initial?.instruction||'指令请查看原始观察文件')}</p></div><span class="pill ${result.success===true?'good':'failure'}">${result.success===true?'原生任务成功':'尚无任务成功'}</span></div>
<div class="run-picker"><label for="run-select">选择完整回合</label><select id="run-select">${task.runs.map(r=>`<option value="${esc(r.name)}" ${r.name===run.name?'selected':''}>${esc(r.name)} · ${r.physical_steps} 物理步 / ${r.decision_count} 调用${r.is_preflight?' · 仅预检':''}</option>`).join('')}</select></div>
<div class="run-meta"><span class="pill">${meta?.physical_steps??'?'} 原生物理步</span><span class="pill">${run.decisions.length} 推进器调用</span><span class="pill">success=${fmt(result.success)}</span><span class="pill">complete=${fmt(result.complete)}</span><span class="pill failure">${esc(run.status||result.reason||'未记录终局')}</span></div>
${!hasDecisions?'<div class="missing">本回合只有传感入口或启动检查，没有推进器输入输出，也没有实体操作。可以查看原始相机观察；不能补成控制回合。</div>':''}
<section class="section"><div class="section-head"><h2>01 / 规划与阶段</h2><span class="small">原文与版本差异</span></div><div class="section-content" id="plans"></div></section>
<section class="section"><div class="section-head"><h2>02 / 原生视频与终局</h2>${link('原生结果 JSON',run.result_url)}</div><div class="section-content">${run.videos.length?`<div class="film"><video controls preload="metadata" src="${esc(run.videos[0].url)}"></video><div class="film-note"><p><strong>整段回合录像</strong></p><p>包括接近、保持、终止或抓取尝试。视频帧数、视角改变和夹爪命令都不计任务成功。</p><p style="margin-top:12px">${run.videos.map(v=>link(v.name,v.url)).join('<br>')}</p><p style="margin-top:12px">最终原因：<code>${esc(run.status||result.reason||'未记录')}</code></p></div></div>`:'<p class="small">该回合没有保存可播放视频。</p>'}${disclosure('原生终局原文（只供人审阅，不是推进器输入）',result)}</div></section>
<section class="section"><div class="section-head"><h2>03 / 从图像到动作：逐步审阅</h2><span class="small">全部 ${run.decisions.length} 次调用</span></div><div class="section-content">${hasDecisions?'<div class="timeline-controls"><button id="previous" aria-label="上一步">←</button><input id="scrub" type="range" min="0" max="'+(run.decisions.length-1)+'" value="0" aria-label="选择推进器调用"><button id="next" aria-label="下一步">→</button><span class="mono" id="step-label"></span></div><div class="timeline" id="timeline"></div><div class="stage-ribbon" id="ribbon"></div><div id="decision" style="margin-top:22px"></div>':'<div id="preflight"></div>'}</div></section>
<section class="section"><div class="section-head"><h2>04 / 执行与证据索引</h2>${link('完整执行 history.json',run.history_url)}</div><div class="section-content"><div class="method-note">阶段的影响以实际输入和候选为准：计划中的阶段列表不等于阶段全部执行过。新版本记录 <code>current_stage</code>、阶段规则与互斥完整候选；早期版本由推进器输出 <code>stage</code> 和各轴判断。选中下面每一步，可核对当步规则、给了哪些动作、模型选了什么，以及原生是否执行。</div>${run.traces.map(t=>disclosure(t.name+' · 控制器轨迹原文',t.data)).join('')}${disclosure('原生逐动作执行记录',run.history)}<div class="provenance">资产目录：${esc(run.source_directory)}<br>所有展示均读取保存记录，不调用模型，不触发仿真。</div></div></section>`;
$('run-select').onchange=e=>chooseRun(e.target.value);renderPlans();if(hasDecisions){$('scrub').oninput=e=>selectTurn(Number(e.target.value));$('previous').onclick=()=>selectTurn(turn-1);$('next').onclick=()=>selectTurn(turn+1);renderTimeline();selectTurn(0);}else if(run.observations.length){$('preflight').innerHTML=renderCameras(run.observations[0].images)+link('原始观察 JSON',run.observations[0].url);bindImages();}else $('preflight').innerHTML='<div class="empty">没有落盘相机观察。</div>';}
function renderPlans(){let html='<div class="method-note"><strong>三个阶段字段分别审阅</strong><br>计划阶段：规划器定义的阶段和门；控制器当前阶段：当步送入推进器的运行标签；推进器阶段输出：早期接口中模型自己判断的阶段。它们可能不同，尤其是网关失败后复用历史方法结构的回合。</div>';
if(!run.plans.length)html+='<div class="empty">本回合没有保存规划文件。</div>';
run.plans.forEach((p,i)=>{const data=p.data,stages=data.stages||{};html+=`<details ${i===0?'open':''}><summary>${esc(p.name)} · ${data.method_only?'仅方法/阶段模式':'早期规划模式，可能包含具体候选'} · initial_stage=${esc(data.initial_stage??'未记录')}</summary><div class="section-content"><div class="plan-stages">${Object.keys(stages).map(key=>`<button class="stage-chip ${key===data.initial_stage?'active':''}" data-plan="${i}" data-stage="${esc(key)}">${esc(key)}</button>`).join('')}</div><div class="plan-recipe" id="recipe-${i}">${esc(stageValue(stages[data.initial_stage]??'未记录阶段配方'))}</div>${disclosure('完整规划 JSON：包括感知方法、阶段通过门、经验使用',data)}<p class="small" style="margin-top:12px">${link('下载原始规划',p.url)}</p></div></details>`;});
if(run.planner_attempts.length)html+=disclosure('本回合规划刷新尝试：是否真的产生新计划',run.planner_attempts);
if(run.historical_question_gap)html+=`<div class="missing" style="margin-top:12px">本回合 ${run.historical_question_gap} 次历史调用未保存完整 questions.instructions / choices.description。保存的 input_text、原图和模型输出可审阅；缺失题目不会由当前源码重建冒充原文。</div>`;
$('plans').innerHTML=html;document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.plan);$('recipe-'+i).textContent=stageValue(run.plans[i].data.stages[b.dataset.stage]);document.querySelectorAll(`[data-plan="${i}"]`).forEach(x=>x.classList.toggle('active',x===b));});}
function renderTimeline(){$('timeline').innerHTML=run.decisions.map((d,i)=>{const text=pretty(d.decoded_answers||{}),kind=text.includes('stop')?'stop':text.includes('gripper')||text.includes('grasp')?'gripper':'';return `<button class="tick ${kind}" data-turn="${i}" title="${esc(decodedStage(d))}">${fmt(d.step_id)}</button>`;}).join('');document.querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>selectTurn(Number(b.dataset.turn)));let last=null,segments=[];run.decisions.forEach(d=>{const s=decodedStage(d);if(s!==last){segments.push({stage:s,start:d.step_id});last=s;}});$('ribbon').innerHTML=segments.map(s=>`<span class="ribbon">${fmt(s.start)} → ${esc(s.stage)}</span>`).join('');}
function selectTurn(i){turn=Math.max(0,Math.min(run.decisions.length-1,i));$('scrub').value=turn;$('previous').disabled=turn===0;$('next').disabled=turn===run.decisions.length-1;document.querySelectorAll('[data-turn]').forEach(b=>b.classList.toggle('active',Number(b.dataset.turn)===turn));$('step-label').textContent=`step ${fmt(run.decisions[turn].step_id)} / 调用 ${turn+1}`;renderDecision();}
function renderCameras(rows){return `<div class="camera-grid">${rows.map(row=>`<figure class="camera">${row.url?`<button data-image="${esc(row.url)}" aria-label="放大${esc(cameraNames[row.camera]||row.camera)}原图"><img loading="lazy" src="${esc(row.url)}" alt="${esc(cameraNames[row.camera]||row.camera)}模型原图"></button>`:'<div class="empty">原图缺失</div>'}<figcaption>${esc(cameraNames[row.camera]||row.camera)} · ${esc(row.camera)}</figcaption><div class="hash">SHA256 ${esc(row.sha256||'旧日志未记录')}</div></figure>`).join('')}</div>`;}
function bindImages(){document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{$('modal-image').src=b.dataset.image;$('modal').classList.add('open');$('close-modal').focus();});}
function outputBars(raw){return (raw||[]).map(answer=>{if(!Array.isArray(answer.probabilities))return disclosure(answer.name+' · 输出',answer);return `<div class="prob-group"><div class="small"><strong>${esc(answer.name)}</strong> · confidence=${fmt(answer.confidence)}</div>${answer.probabilities.map(p=>`<div class="prob-row ${p.value===answer.choice?'selected':''}"><span class="prob-name">${esc(p.value)}</span><div class="prob-track"><div class="prob-fill" style="width:${Math.min(100,Math.max(0,Number(p.probability)*100))}%"></div></div><span>${Number(p.probability).toFixed(2)}</span></div>`).join('')}</div>`;}).join('');}
function executionText(d){const row=d.execution;if(!row)return '<div class="missing">本次模型输出没有对应的原生执行记录。STOP、门拒绝或程序中止均可能导致不执行；查看当步轨迹原文确认。</div>';const action=row.response||{},start=row.start_tick,end=row.end_tick;const eef=d.input_object.measured_eef||d.input_object.current_eef||{};let deltas={};for(const arm of ['left','right']){if(action.target?.[arm]?.position&&eef[arm]?.position)deltas[arm]=action.target[arm].position.map((v,i)=>Math.round((v-eef[arm].position[i])*10000)/10);}
return `<div class="execution"><div class="subhead">实际执行，而非收到命令的回执</div><div class="action-line">原生 step ${fmt(start)} → ${fmt(end)} · executed_steps=${fmt(row.executed_steps)}</div>${Object.keys(deltas).length?`<div class="action-line">目标 WORLD ΔXYZ (mm)：${esc(pretty(deltas))}</div>`:''}${disclosure('完整执行目标、夹爪命令与原生回执',row)}${d.trace.post_action?disclosure('执行后实测跟踪误差及图像变化',d.trace.post_action):''}</div>`;}
function renderDecision(){const d=run.decisions[turn],obj=d.input_object,stageFields=Object.fromEntries(Object.entries(obj).filter(([k])=>k.includes('stage')||k.includes('phase')||k.includes('method')||k.includes('experience')||k.includes('memory'))),geometryFields=Object.fromEntries(Object.entries(obj).filter(([k])=>/geometry|support|residual|error|plane|eef|joint|axis|frame|feature|pixel|orientation|targets/.test(k))),q=d.questions||[];const held=d.trace?.luna_action_family;const lastObs=run.observations.find(o=>o.step_id===(d.execution?.end_tick));
$('decision').innerHTML=`<div class="decision-heading"><h3>step ${fmt(d.step_id)} · ${esc(d.model||'模型未记录')}</h3>${link('原始调用 JSON',d.url)}</div><div class="stage-explanation"><div class="stage-box"><span class="small">控制器当前阶段（输入）</span><strong>${esc(fmt(d.runtime_stage))}</strong></div><div class="stage-box"><span class="small">规划阶段（输入引用）</span><strong>${esc(fmt(d.planner_stage))}</strong></div><div class="stage-box"><span class="small">推进器阶段（输出）</span><strong>${esc(fmt(d.model_stage))}</strong></div></div>
${obj.method_refresh?.fallback?`<div class="missing">规划回退：${esc(obj.method_refresh.fallback)}。${esc(obj.method_refresh.method_refresh_error||'')} 当步几何仍来自本回合新鲜图像；此处没有新的规划成功记录。</div>`:''}
<p class="subhead" style="margin-top:15px">推进器实际收到的图像 · 三原RGB及已记录的当前派生图 · 点击放大</p>${renderCameras(d.images)}
<div class="decision-columns"><div><p class="subhead">INPUT / 文本与完整问题</p>${d.questions_available?disclosure('实际 questions 原文：说明、候选与字段定义',q,true):'<div class="missing">完整 questions 未保存。以下 input_text 是保存原文，不能代表缺失的题目说明。</div>'}${disclosure('实际 input_text 全文：送给推进器的文本',d.input_text)}${(d.evidence_assets||[]).length?'<p class="small">经验读取与几何快照：'+d.evidence_assets.map(a=>link(a.name,a.url)).join(' · ')+'</p>':''}${disclosure('输入字段展开（若原文为 JSON）',obj)}${disclosure('当前几何 / 机器人状态 / XYZ误差字段',geometryFields)}${disclosure('阶段规则 / 感知方法 / 经验字段',stageFields)}</div><div><p class="subhead">OUTPUT / 模型判断与最终完整动作</p><div class="answer">${esc(pretty(d.decoded_answers))}</div>${held?`<p class="small" style="margin-top:8px">动作族=${esc(held)}；最终完整动作=${esc(d.trace.luna_choice)}。非 motion 时，运动问输出被忽略。</p>`:''}${outputBars(d.raw_answers)}${disclosure('推进器完整原始输出',d.raw_answers)}${executionText(d)}${d.trace&&Object.keys(d.trace).length?disclosure('当步控制器记录：候选门 / 拒绝原因 / 刷新',d.trace):''}<p class="small" style="margin-top:10px">latency=${fmt(d.latency_s)}s · response_model=${esc(d.response_model||'旧日志未记录')} · 模型自报概率未经校准</p></div></div>
${lastObs?`<details><summary>执行后的原生三RGB · step ${lastObs.step_id}</summary><div class="section-content">${renderCameras(lastObs.images)}${link('执行后原始观察',lastObs.url)}</div></details>`:''}`;bindImages();}
$('search').oninput=()=>archive&&taskList();$('refresh').onclick=()=>init(true);$('close-modal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open');};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open');});init();
</script>
</body>
</html>
